server:
    port: 8081
spring:
    application:
        name: auth-service
    threads:
        virtual:
            enabled: true
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/db_auth}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

        jpa:
            hibernate:
                ddl-auto: update
            show-sql: false
app:
    admin:
        email: ${ADMIN_EMAIL:tuamail@gmail.com}
google:
    jwks:
        uri: https://www.googleapis.com/oauth2/v3/certs
app:
    frontend:
        url: "http://localhost:3000"

jwt:
    private:
        key: ${JWT_PRIVATE_KEY_PATH:classpath:cert/private.pem}
    public:
        key: ${JWT_PUBLIC_KEY_PATH:classpath:cert/public.pem}

gateway:
    secret: ${GATEWAY_SECRET}
